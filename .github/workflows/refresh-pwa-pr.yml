name: Refresh PWA assets for performance PR
on:
  push:
    branches: [perf/stabilize-ranking-dom-20261014]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate version and verify tests
        run: |
          python scripts/build_pwa.py
          python scripts/check_data.py
          python scripts/test_ranking.py
          npm ci --ignore-scripts
          npm test
      - name: Commit synchronized PWA resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html consulta.html service-worker.js versao.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize offline shell integrity with performance fix"
            git push origin HEAD:perf/stabilize-ranking-dom-20261014
          fi
