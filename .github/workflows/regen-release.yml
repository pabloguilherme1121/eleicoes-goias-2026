name: Regenerate electoral release assets
on:
  push:
    branches: [fix/observatorio-confiabilidade-mobile-20261014]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reconcile derived data and version PWA
        run: |
          python scripts/enrich_regions.py
          python scripts/build_pwa.py
          python scripts/check_data.py
          python scripts/test_ranking.py
          npm ci --ignore-scripts
          npm test
      - name: Persist matching snapshot and offline assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidatos.json data/proveniencia.json index.html consulta.html service-worker.js versao.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: reconcile candidate ranks and regenerate offline release"
            git push origin HEAD:fix/observatorio-confiabilidade-mobile-20261014
          fi
