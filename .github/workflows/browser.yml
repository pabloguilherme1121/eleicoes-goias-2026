name: Browser smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    name: Browser / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Install pinned Playwright test runner
        run: npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.56.1
      - name: Install browser with dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run smoke tests
        run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
